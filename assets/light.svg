      <text x="270" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#656D76">65%</text>
      <circle cx="300" cy="3" r="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="300" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1F2328">65</text>
    </g>

    <!-- C++ -->
    <g transform="translate(0, 86)">
      <rect x="0" y="-6" width="260" height="18" rx="3" fill="#F6F8FA"/>
      <rect x="0" y="-6" width="130" height="18" rx="3" fill="url(#barCpp)" class="bar-fill"/>
      <text x="8" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="600">C++</text>
      <text x="270" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#656D76">50%</text>
      <circle cx="300" cy="3" r="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="300" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1F2328">50</text>
    </g>

    <!-- Tech icons row -->
    <g transform="translate(335, 15)">
      <rect x="0" y="0" width="525" height="100" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="262" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#656D76" letter-spacing="2">TECH STACK</text>
      <line x1="20" y1="28" x2="505" y2="28" stroke="#D0D7DE" stroke-width="0.5"/>
      
      <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#656D76" text-anchor="middle">
        <text x="47" y="52" font-size="16" fill="#0969DA"></text>
        <text x="47" y="68" fill="#1F2328">Python</text>
        
        <text x="117" y="52" font-size="16" fill="#D97706">☕</text>
        <text x="117" y="68" fill="#1F2328">Java</text>
        
        <text x="187" y="52" font-size="16" fill="#2563EB">&#43;&#43;</text>
        <text x="187" y="68" fill="#1F2328">C++</text>
        
        <text x="257" y="52" font-size="14" fill="#1A7F37">⚛</text>
        <text x="257" y="68" fill="#1F2328">React</text>
        
        <text x="327" y="52" font-size="14" fill="#7C3AED">◆</text>
        <text x="327" y="68" fill="#1F2328">Docker</text>
        
        <text x="397" y="52" font-size="14" fill="#DC2626">🗄</text>
        <text x="397" y="68" fill="#1F2328">PostgreSQL</text>

        <text x="467" y="52" font-size="14" fill="#D97706">🔥</text>
        <text x="467" y="68" fill="#1F2328">FastAPI</text>

        <text x="47" y="90" font-size="14" fill="#4F46E5">◆</text>
        <text x="47" y="90" fill="#1F2328">TensorFlow</text>

        <text x="157" y="90" font-size="14" fill="#DB2777"></text>
        <text x="157" y="90" fill="#1F2328">PyTorch</text>

        <text x="267" y="90" font-size="14" fill="#0891B2"></text>
        <text x="267" y="90" fill="#1F2328">Next.js</text>

        <text x="377" y="90" font-size="14" fill="#65A30D"></text>
        <text x="377" y="90" fill="#1F2328">Git</text>

        <text x="467" y="90" font-size="14" fill="#E11D48">◆</text>
        <text x="467" y="90" fill="#1F2328">MongoDB</text>
      </g>
    </g>
  </g>

  <!-- === PROJECTS === -->
  <g transform="translate(40, 555)">
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#656D76" text-transform="uppercase" letter-spacing="2">── Projects ──────────────────────────────────────────────</text>

    <!-- Card 1 -->
    <g transform="translate(0, 20)" filter="url(#shadowCard)">
      <rect x="0" y="0" width="430" height="84" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" class="card-hover"/>
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#2563EB"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1F2328">Dynamic LLM Gateway</text>
      <text x="20" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#656D76">AI Gateway • Redis • Go • Docker • Kubernetes</text>
      <rect x="20" y="55" width="60" height="18" rx="3" fill="#EEF2FF" stroke="#D0D7DE" stroke-width="0.5"/>
      <text x="50" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0969DA">AI/ML</text>
      <rect x="86" y="55" width="52" height="18" rx="3" fill="#EEF2FF" stroke="#D0D7DE" stroke-width="0.5"/>
      <text x="112" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1A7F37">Backend</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(450, 20)" filter="url(#shadowCard)">
      <rect x="0" y="0" width="430" height="84" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" class="card-hover"/>
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#7C3AED"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1F2328">RAG Voice Assistant</text>
      <text x="20" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#656D76">RAG • LiveKit • OpenAI • Pinecone • Streamlit</text>
      <rect x="20" y="55" width="52" height="18" rx="3" fill="#EEF2FF" stroke="#D0D7DE" stroke-width="0.5"/>
