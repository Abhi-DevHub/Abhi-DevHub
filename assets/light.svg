    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#656D76" text-transform="uppercase" letter-spacing="2">── Languages ─────────────────────────────────────────────</text>

    <!-- Python -->
    <g transform="translate(0, 30)">
      <rect x="0" y="-6" width="260" height="18" rx="3" fill="#F6F8FA"/>
      <rect x="0" y="-6" width="208" height="18" rx="3" fill="url(#barPython)" class="bar-fill"/>
      <text x="8" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="600">Python</text>
      <text x="270" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#656D76">80%</text>
      <circle cx="300" cy="3" r="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="300" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1F2328">80</text>
