      <rect x="85" y="-4" width="180" height="16" rx="3" fill="#0969DA" class="bar-fill"/>
      <text x="340" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1F2328" font-weight="600">26</text>
    </g>

    <!-- Stars -->
