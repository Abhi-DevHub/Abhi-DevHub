      <text x="0" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#656D76">Stars   </text>
      <rect x="85" y="-3" width="240" height="16" rx="3" fill="#F6F8FA"/>
      <rect x="85" y="-3" width="100" height="16" rx="3" fill="#BF8700" class="bar-fill"/>
      <text x="340" y="9" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1F2328" font-weight="600">14</text>
    </g>

