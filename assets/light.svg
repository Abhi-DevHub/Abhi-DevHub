<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="barPython" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barJava" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="barCpp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0D7DE"/>
      <stop offset="100%" stop-color="#AFB8C1"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowCard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(59,130,246,0.2)); }
      50% { filter: drop-shadow(0 0 16px rgba(59,130,246,0.4)); }
    }
    .cursor { animation: blink 1s step-end infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    .glow-ring { animation: glow 3s ease-in-out infinite; }
    .bar-fill { animation: widen 1.5s ease-out forwards; transform-origin: left; }
    @keyframes widen {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .fade-in { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.2s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    .fade-in:nth-child(4) { animation-delay: 0.4s; }
    .fade-in:nth-child(5) { animation-delay: 0.5s; }
    .fade-in:nth-child(6) { animation-delay: 0.6s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); }
  </style>

  <!-- Terminal Window -->
  <rect x="10" y="10" width="920" height="760" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
  <rect x="10" y="10" width="920" height="34" rx="10" fill="#F6F8FA"/>
  <rect x="10" y="32" width="920" height="12" fill="#F6F8FA"/>

  <!-- Traffic Lights -->
  <circle cx="34" cy="27" r="6" fill="#CF222E"/>
  <circle cx="52" cy="27" r="6" fill="#BF8700"/>
  <circle cx="70" cy="27" r="6" fill="#1A7F37"/>

  <!-- Title -->
  <text x="470" y="32" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="12" fill="#656D76">abhishek@github:~/README — bash</text>

  <!-- === LEFT COLUMN: AVATAR === -->
  <g transform="translate(40, 70)">
    <!-- Avatar glow ring -->
    <circle cx="100" cy="100" r="68" fill="none" stroke="url(#glow)" stroke-width="4" class="glow-ring"/>
    <!-- Avatar circle -->
    <circle cx="100" cy="100" r="65" fill="url(#avatarGrad)"/>
    <circle cx="100" cy="100" r="65" fill="none" stroke="#D0D7DE" stroke-width="2"/>
    <!-- Initial -->
    <text x="100" y="123" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">A</text>
    <!-- Name -->
    <text x="100" y="195" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Abhishek M Hiremath</text>
    <!-- Tags -->
    <g class="fade-in">
      <rect x="25" y="215" width="150" height="24" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="100" y="232" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0969DA">AI Engineer</text>
    </g>
    <g class="fade-in">
      <rect x="25" y="245" width="150" height="24" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="100" y="262" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A7F37">Backend Developer</text>
    </g>
    <g class="fade-in">
      <rect x="25" y="275" width="150" height="24" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <text x="100" y="292" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9A6700">Open Source Contributor</text>
    </g>
  </g>

  <!-- === RIGHT COLUMN: NEOFETCH === -->
  <g transform="translate(310, 70)">
    <!-- Prompt -->
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#1A7F37">
      <tspan fill="#1A7F37">abhishek</tspan>
      <tspan fill="#656D76">@</tspan>
      <tspan fill="#0969DA">github</tspan>
      <tspan fill="#656D76">:~$ </tspan>
      <tspan fill="#1F2328">neofetch</tspan>
    </text>

    <!-- Neofetch output -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
      <!-- Divider -->
      <text x="0" y="22" fill="#D0D7DE">─────────────────────────────</text>

      <text class="fade-in" x="0" y="42" fill="#656D76">OS        </text>
      <text class="fade-in" x="105" y="42" fill="#1F2328">Windows 11 + Ubuntu</text>

      <text class="fade-in" x="0" y="62" fill="#656D76">Shell     </text>
      <text class="fade-in" x="105" y="62" fill="#1F2328">PowerShell + ZSH</text>

      <text class="fade-in" x="0" y="82" fill="#656D76">Editor    </text>
      <text class="fade-in" x="105" y="82" fill="#1F2328">VS Code</text>

      <text class="fade-in" x="0" y="102" fill="#656D76">Focus     </text>
      <text class="fade-in" x="105" y="102" fill="#1F2328">AI/ML  •  Backend  •  LLMOps</text>

      <text class="fade-in" x="0" y="122" fill="#656D76">University</text>
      <text class="fade-in" x="105" y="122" fill="#1F2328">PES University</text>

      <text class="fade-in" x="0" y="142" fill="#656D76">Company   </text>
      <text class="fade-in" x="105" y="142" fill="#1F2328">Sharpsell.ai</text>
    </g>
  </g>

  <!-- === DIVIDER === -->
  <line x1="40" y1="305" x2="900" y2="305" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- === LANGUAGES === -->
