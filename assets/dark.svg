      <rect x="85" y="-3" width="240" height="16" rx="3" fill="#161B22"/>
      <rect x="85" y="-3" width="100" height="16" rx="3" fill="#D29922" class="bar-fill"/>
      <text x="340" y="9" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E6EDF3" font-weight="600">14</text>
    </g>

