    <!-- Java -->
    <g transform="translate(0, 58)">
      <rect x="0" y="-6" width="260" height="18" rx="3" fill="#161B22"/>
      <rect x="0" y="-6" width="169" height="18" rx="3" fill="url(#barJava)" class="bar-fill"/>
      <text x="8" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="600">Java</text>
      <text x="270" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">65%</text>
      <circle cx="300" cy="3" r="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="300" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E6EDF3">65</text>
    </g>

    <!-- C++ -->
    <g transform="translate(0, 86)">
      <rect x="0" y="-6" width="260" height="18" rx="3" fill="#161B22"/>
      <rect x="0" y="-6" width="130" height="18" rx="3" fill="url(#barCpp)" class="bar-fill"/>
      <text x="8" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="600">C++</text>
      <text x="270" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">50%</text>
      <circle cx="300" cy="3" r="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="300" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E6EDF3">50</text>
    </g>

    <!-- Tech icons row -->
    <g transform="translate(335, 15)">
      <rect x="0" y="0" width="525" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="262" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B949E" letter-spacing="2">TECH STACK</text>
      <line x1="20" y1="28" x2="505" y2="28" stroke="#30363D" stroke-width="0.5"/>
      
      <!-- Icons row -->
      <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B949E" text-anchor="middle">
        <text x="47" y="52" font-size="16" fill="#58A6FF"></text>
        <text x="47" y="68" fill="#E6EDF3">Python</text>
        
        <text x="117" y="52" font-size="16" fill="#F59E0B">☕</text>
        <text x="117" y="68" fill="#E6EDF3">Java</text>
        
        <text x="187" y="52" font-size="16" fill="#3B82F6">&#43;&#43;</text>
        <text x="187" y="68" fill="#E6EDF3">C++</text>
        
        <text x="257" y="52" font-size="14" fill="#3FB950">⚛</text>
        <text x="257" y="68" fill="#E6EDF3">React</text>
        
        <text x="327" y="52" font-size="14" fill="#8B5CF6">◆</text>
        <text x="327" y="68" fill="#E6EDF3">Docker</text>
        
        <text x="397" y="52" font-size="14" fill="#EF4444">🗄</text>
        <text x="397" y="68" fill="#E6EDF3">PostgreSQL</text>

        <text x="467" y="52" font-size="14" fill="#F59E0B">🔥</text>
        <text x="467" y="68" fill="#E6EDF3">FastAPI</text>

        <text x="47" y="90" font-size="14" fill="#6366F1">◆</text>
        <text x="47" y="90" fill="#E6EDF3">TensorFlow</text>

        <text x="157" y="90" font-size="14" fill="#EC4899"></text>
        <text x="157" y="90" fill="#E6EDF3">PyTorch</text>

        <text x="267" y="90" font-size="14" fill="#06B6D4"></text>
        <text x="267" y="90" fill="#E6EDF3">Next.js</text>

        <text x="377" y="90" font-size="14" fill="#84CC16"></text>
        <text x="377" y="90" fill="#E6EDF3">Git</text>

        <text x="467" y="90" font-size="14" fill="#F43F5E">◆</text>
        <text x="467" y="90" fill="#E6EDF3">MongoDB</text>
      </g>
    </g>
  </g>

  <!-- === PROJECTS === -->
  <g transform="translate(40, 555)">
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8B949E" text-transform="uppercase" letter-spacing="2">── Projects ──────────────────────────────────────────────</text>

    <!-- Card 1 -->
    <g transform="translate(0, 20)" filter="url(#shadowCard)">
      <rect x="0" y="0" width="430" height="84" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" class="card-hover"/>
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#3B82F6"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#E6EDF3">Dynamic LLM Gateway</text>
      <text x="20" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B949E">AI Gateway • Redis • Go • Docker • Kubernetes</text>
      <rect x="20" y="55" width="60" height="18" rx="3" fill="#1E293B" stroke="#30363D" stroke-width="0.5"/>
      <text x="50" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58A6FF">AI/ML</text>
      <rect x="86" y="55" width="52" height="18" rx="3" fill="#1E293B" stroke="#30363D" stroke-width="0.5"/>
      <text x="112" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3FB950">Backend</text>
    </g>

    <!-- Card 2 -->
