      <rect x="85" y="-4" width="240" height="16" rx="3" fill="#161B22"/>
      <rect x="85" y="-4" width="180" height="16" rx="3" fill="#58A6FF" class="bar-fill"/>
      <text x="340" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E6EDF3" font-weight="600">26</text>
    </g>

    <!-- Stars -->
