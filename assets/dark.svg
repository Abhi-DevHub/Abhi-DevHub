<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barPython" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="barJava" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="barCpp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowCard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(59,130,246,0.3)); }
      50% { filter: drop-shadow(0 0 16px rgba(59,130,246,0.6)); }
    }
    .cursor { animation: blink 1s step-end infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    .glow-ring { animation: glow 3s ease-in-out infinite; }
    .bar-fill { animation: widen 1.5s ease-out forwards; transform-origin: left; }
    @keyframes widen {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .fade-in { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.2s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    .fade-in:nth-child(4) { animation-delay: 0.4s; }
    .fade-in:nth-child(5) { animation-delay: 0.5s; }
    .fade-in:nth-child(6) { animation-delay: 0.6s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); }
  </style>

  <!-- Terminal Window -->
  <rect x="10" y="10" width="920" height="760" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <rect x="10" y="10" width="920" height="34" rx="10" fill="#161B22"/>
  <rect x="10" y="32" width="920" height="12" fill="#161B22"/>

  <!-- Traffic Lights -->
  <circle cx="34" cy="27" r="6" fill="#F85149"/>
  <circle cx="52" cy="27" r="6" fill="#D29922"/>
  <circle cx="70" cy="27" r="6" fill="#3FB950"/>

  <!-- Title -->
  <text x="470" y="32" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="12" fill="#8B949E">abhishek@github:~/README — bash</text>

  <!-- === LEFT COLUMN: AVATAR === -->
  <g transform="translate(40, 70)">
    <!-- Avatar glow ring -->
    <circle cx="100" cy="100" r="68" fill="none" stroke="url(#glow)" stroke-width="4" class="glow-ring"/>
    <!-- Avatar circle -->
    <circle cx="100" cy="100" r="65" fill="url(#avatarGrad)"/>
    <circle cx="100" cy="100" r="65" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Initial -->
    <text x="100" y="123" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">A</text>
    <!-- Name -->
    <text x="100" y="195" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">Abhishek M Hiremath</text>
    <!-- Tags -->
    <g class="fade-in">
      <rect x="25" y="215" width="150" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="100" y="232" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#58A6FF">AI Engineer</text>
    </g>
    <g class="fade-in">
      <rect x="25" y="245" width="150" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="100" y="262" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3FB950">Backend Developer</text>
    </g>
    <g class="fade-in">
      <rect x="25" y="275" width="150" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="100" y="292" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D29922">Open Source Contributor</text>
    </g>
  </g>

  <!-- === RIGHT COLUMN: NEOFETCH === -->
  <g transform="translate(310, 70)">
    <!-- Prompt -->
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#3FB950">
      <tspan fill="#3FB950">abhishek</tspan>
      <tspan fill="#8B949E">@</tspan>
      <tspan fill="#58A6FF">github</tspan>
      <tspan fill="#8B949E">:~$ </tspan>
      <tspan fill="#E6EDF3">neofetch</tspan>
    </text>

    <!-- Neofetch output -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
      <!-- Divider -->
      <text x="0" y="22" fill="#30363D">─────────────────────────────</text>

      <text class="fade-in" x="0" y="42" fill="#8B949E">OS        </text>
      <text class="fade-in" x="105" y="42" fill="#E6EDF3">Windows 11 + Ubuntu</text>

      <text class="fade-in" x="0" y="62" fill="#8B949E">Shell     </text>
      <text class="fade-in" x="105" y="62" fill="#E6EDF3">PowerShell + ZSH</text>

      <text class="fade-in" x="0" y="82" fill="#8B949E">Editor    </text>
      <text class="fade-in" x="105" y="82" fill="#E6EDF3">VS Code</text>

      <text class="fade-in" x="0" y="102" fill="#8B949E">Focus     </text>
      <text class="fade-in" x="105" y="102" fill="#E6EDF3">AI/ML  •  Backend  •  LLMOps</text>

      <text class="fade-in" x="0" y="122" fill="#8B949E">University</text>
      <text class="fade-in" x="105" y="122" fill="#E6EDF3">PES University</text>

      <text class="fade-in" x="0" y="142" fill="#8B949E">Company   </text>
      <text class="fade-in" x="105" y="142" fill="#E6EDF3">Sharpsell.ai</text>
    </g>
  </g>

  <!-- === DIVIDER === -->
  <line x1="40" y1="305" x2="900" y2="305" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- === LANGUAGES === -->
  <g transform="translate(40, 325)">
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8B949E" text-transform="uppercase" letter-spacing="2">── Languages ─────────────────────────────────────────────</text>

    <!-- Python -->
    <g transform="translate(0, 30)">
      <rect x="0" y="-6" width="260" height="18" rx="3" fill="#161B22"/>
      <rect x="0" y="-6" width="208" height="18" rx="3" fill="url(#barPython)" class="bar-fill"/>
      <text x="8" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="600">Python</text>
      <text x="270" y="7" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B949E">80%</text>
      <circle cx="300" cy="3" r="14" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="300" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E6EDF3">80</text>
