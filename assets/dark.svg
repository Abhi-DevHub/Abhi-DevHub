      <rect x="0" y="0" width="430" height="84" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" class="card-hover"/>
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#8B5CF6"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#E6EDF3">RAG Voice Assistant</text>
      <text x="20" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B949E">RAG • LiveKit • OpenAI • Pinecone • Streamlit</text>
      <rect x="20" y="55" width="52" height="18" rx="3" fill="#1E293B" stroke="#30363D" stroke-width="0.5"/>
      <text x="46" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58A6FF">AI/ML</text>
      <rect x="78" y="55" width="52" height="18" rx="3" fill="#1E293B" stroke="#30363D" stroke-width="0.5"/>
